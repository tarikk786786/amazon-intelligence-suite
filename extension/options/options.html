<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon Intelligence Pro — Settings</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .settings-card {
      width: 100%;
      max-width: 540px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: var(--text);
    }
    .hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }
    .hint a {
      color: var(--accent);
      text-decoration: none;
    }
    input, select {
      width: 100%;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      box-sizing: border-box;
    }
    input:focus, select:focus {
      border-color: var(--accent);
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: filter 0.2s;
    }
    .btn:hover {
      filter: brightness(1.1);
    }
    #status {
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
    }
    .status-ok { color: #34d399; }
  </style>
</head>
<body>
  <div class="settings-card">
    <h1>🛰️ Amazon Intelligence Settings</h1>
    <p class="subtitle">Configure your API credentials and marketplace preferences.</p>

    <div class="form-group">
      <label>Pangolinfo API Token (PANGOLIN_TOKEN)</label>
      <input type="password" id="pangolinToken" placeholder="Paste token here..." />
      <div class="hint">Get your free token (200 free calls) at <a href="https://tool.pangolinfo.com/#/en/system/login?mode=register" target="_blank">tool.pangolinfo.com ↗</a></div>
    </div>

    <div class="form-group">
      <label>Google Gemini API Key (GEMINI_API_KEY)</label>
      <input type="text" id="geminiApiKey" placeholder="AI Studio key" />
      <div class="hint">Powers AI daily digests & review theme synthesis.</div>
    </div>

    <div class="form-group">
      <label>Default Marketplace</label>
      <select id="defaultMarketplace">
        <option value="www.amazon.in">Amazon India (www.amazon.in)</option>
        <option value="www.amazon.com">Amazon USA (www.amazon.com)</option>
        <option value="www.amazon.co.uk">Amazon UK (www.amazon.co.uk)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Default Delivery Pincode / Zipcode</label>
      <input type="text" id="defaultZipcode" value="110001" />
      <div class="hint">110001 = New Delhi, 10041 = New York City</div>
    </div>

    <button id="saveBtn" class="btn">Save & Activate Settings</button>
    <div id="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
